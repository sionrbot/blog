packages:
  - '.'
nodeVersion: 26.13.0
runtimeOnFail: ignore
pmOnFail: ignore
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@cloudflare/build-output-utils@0.9.10'
  - '@cloudflare/config@0.30.2'
  - '@cloudflare/runtime-types@0.1.23'
  - cf@1.0.0-beta.28
  - miniflare@5.20261104.0-beta
  - wrangler@4.158.0
