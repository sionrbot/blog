packages:
  - '.'
nodeVersion: 26.13.0
runtimeOnFail: ignore
pmOnFail: ignore
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.5.0
overrides:
  vite@*: 'catalog:'
  # GHSA-g3hv-75wg-m249: remove once these consumers support a patched minimatch.
  'eslint@10.14.0>minimatch': 11.0.5
  '@eslint/config-array@0.23.5>minimatch': 11.0.5
  '@typescript-eslint/typescript-estree@8.72.1>minimatch': 11.0.5
  '@google-automations/git-file-utils@3.2.1>minimatch': 11.0.5
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@cloudflare/build-output-utils@0.9.10'
  - '@cloudflare/config@0.30.2'
  - '@cloudflare/runtime-types@0.1.23'
  - cf@1.0.0-beta.28
  - miniflare@5.20261104.0-beta
  - wrangler@4.158.0
  - '@isaacs/nonrecursive-glob-match@1.1.0'
  - minimatch@11.0.5
