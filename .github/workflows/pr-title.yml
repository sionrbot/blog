name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|perf|revert|content|docs|chore|test|ci|build|refactor|style)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/u;
            if (!pattern.test(title)) {
              core.setFailed('Use a Conventional Commit title, e.g. feat: add search, fix: correct dates, or content: publish an article. See docs/releasing.md.');
            }
