name: Deploy release to GitHub Pages and Cloudflare Workers

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published release with validated deployment assets
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest published stable release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      # Run trusted main tooling; the downloaded packages are treated only as data.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - id: release
        name: Download and verify published release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy-release.ts prepare "$RELEASE_TAG" deployment-assets
      - id: assets
        uses: actions/upload-artifact@v7
        with:
          name: deployment-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-assets/
          if-no-files-found: error
          retention-days: 7

  pages:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: deployment-assets/
      - run: node scripts/deploy-release.ts extract deployment-assets/pages.tar dist
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  cloudflare:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: deployment-assets/
      - run: node scripts/deploy-release.ts extract deployment-assets/workers.tar .cloudflare/output
      - run: pnpm exec cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
