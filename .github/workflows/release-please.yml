name: Release

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI, E2E]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, update the release PR, or retry publishing validated releases
        type: choice
        options: [check, pr, publish]
        default: check

permissions:
  contents: read

# PR updates and publishing share a queue. Completed CI/E2E events also retry
# candidates if an earlier event arrived before the other workflow finished.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      # Only trusted main-branch tooling runs with the release token.
      # PR evidence must match the actual merged source tree; no post-merge rebuild.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - name: Verify release credential
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Configure RELEASE_TOKEN. See docs/releasing.md.'
            exit 1
          fi
      - name: Manage releases
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'sync' }}
        run: node scripts/release.ts "$RELEASE_MODE"

  deploy:
    # Publishing assets can succeed even if refreshing the next release PR fails.
    if: ${{ always() && needs.release.outputs.release_tag != '' }}
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
