name: Maintain release PR

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - id: pnpm_store
        name: Locate pnpm store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm_cache
        name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Maintain version PR without publishing
        run: node scripts/release.ts pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
