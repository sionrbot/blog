name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Replace superseded PR runs; manual runs retain independent execution histories.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The browser and Lighthouse baseline serves dist at the domain root.
# Release bundles separately build each configured production target.
env:
  SITE_URL: https://sionrbot.github.io

jobs:
  variant:
    runs-on: ubuntu-latest
    # Keep this version aligned with @e2e-dev/web's playwright-core dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    # Preserve the two former 20-minute job budgets for combined variants.
    timeout-minutes: ${{ matrix.variant == 'i18n' && 20 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        variant: [default, rendering, configured-forms, i18n]
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - id: pnpm
        run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: browsers
        name: Verify preinstalled browsers
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { accessSync, constants } from 'node:fs';
          const require = createRequire(import.meta.url);
          const webRequire = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = webRequire('playwright-core/package.json');
          if (version !== '1.64.1') throw new Error(`Update the container image for Playwright ${version}`);
          const { chromium, webkit } = webRequire('playwright-core');
          for (const browser of [chromium, webkit]) {
            accessSync(browser.executablePath(), constants.X_OK);
            console.log(`${browser.name()}: ${browser.executablePath()}`);
          }
          NODE
      # Only default consumes root dist; fixture variants build isolated sites.
      - id: baseline_build
        if: ${{ matrix.variant == 'default' }}
        run: pnpm build
      - id: browser
        timeout-minutes: 20
        run: pnpm run test:e2e -- --variant ${{ matrix.variant }} --target desktop,narrow,webkit
      - id: browser_artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.variant }}-${{ github.run_attempt }}
          path: |
            .e2e/runs/*/deterministic/
            tests/test-results/build/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      # Both default suites read the same dist. Fixture/runner lifecycles stay isolated.
      # An explicit status function allows AI coverage after a browser failure.
      - id: agent
        if: ${{ !cancelled() && matrix.variant != 'i18n' && steps.browsers.outcome == 'success' && (matrix.variant != 'default' || steps.baseline_build.outcome == 'success') }}
        timeout-minutes: 20
        run: pnpm run test:e2e:ai -- --variant ${{ matrix.variant }} --target desktop,narrow --max-failures 2 --max-duration 600000
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E_MODEL: gpt-6.1-sol
      - id: agent_artifacts
        if: ${{ !cancelled() && matrix.variant != 'i18n' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ai-${{ matrix.variant }}-${{ github.run_attempt }}
          path: |
            .e2e/runs/*/ai/
            tests/test-results/build/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Verify required E2E stages
        if: ${{ always() }}
        run: node scripts/verify-e2e-job.ts
        env:
          E2E_VARIANT: ${{ matrix.variant }}
          E2E_CANCELLED: ${{ job.status == 'cancelled' }}
          E2E_STEPS: ${{ toJSON(steps) }}

  evidence:
    needs: variant
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release-please--branches--main--components--sionrbot-blog' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The matrix dependency must succeed in all four variants before attesting.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Record E2E evidence
        run: node scripts/release-evidence.ts e2e e2e-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-${{ github.run_attempt }}
          path: e2e-evidence/
          if-no-files-found: error
          retention-days: 90
