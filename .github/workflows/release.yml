name: Release fixed source
run-name: ${{ github.event_name == 'workflow_dispatch' && format('content {0}', inputs.sha) || format('software {0}', github.event.pull_request.merge_commit_sha) }}

on:
  pull_request:
    branches: [release]
    types: [closed]
  workflow_dispatch:
    inputs:
      sha:
        description: Full release HEAD SHA approved for content deployment
        required: true
        type: string

permissions:
  contents: read

# Covers validation, publication and both deployments. Maintenance has its own group.
concurrency:
  group: release-production
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'release' &&
      github.event.pull_request.head.ref == 'release-please--branches--release--components--sionrbot-blog' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    outputs:
      kind: ${{ steps.candidate.outputs.kind }}
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      tag-sha: ${{ steps.candidate.outputs.tag-sha }}
      pr: ${{ steps.candidate.outputs.pr }}
      publish: ${{ steps.publish.outcome }}
      attempt: ${{ steps.prepared.outputs.attempt }}
      workers-artifact: ${{ steps.workers_upload.outputs.artifact-id }}
    env:
      SITE_URL: https://sionrbot.github.io
      CF_SEND_TELEMETRY: 'false'
    steps:
      - id: admission
        name: Validate content execution ref and fixed input before checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/release || ! "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ || "$CANDIDATE_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::Content deployment requires the release ref and its complete event SHA.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/release`, {
            headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`Cannot verify release HEAD: ${response.status}`);
          const ref = await response.json();
          if (ref.object?.type !== 'commit' || ref.object.sha !== process.env.CANDIDATE_SHA) throw new Error('Content candidate must equal live release HEAD');
          NODE
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - id: pnpm
        run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - id: pnpm_store
        name: Locate pnpm store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm_cache
        name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml') }}
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: candidate
        name: Fix and validate the software or content candidate
        run: node scripts/release-fixed.ts candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: checks
        name: Check source, translations, logic and timezones
        run: |
          pnpm run check
          pnpm exec vp check
          pnpm run lint
          pnpm run i18n:check
          pnpm run test:unit
          pnpm run test:unit:tz
      - id: browsers
        name: Verify preinstalled browser versions
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { accessSync, constants } from 'node:fs';
          const require = createRequire(import.meta.url);
          const webRequire = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = webRequire('playwright-core/package.json');
          if (version !== '1.64.1') throw new Error(`Update the container image for Playwright ${version}`);
          const { chromium, webkit } = webRequire('playwright-core');
          for (const browser of [chromium, webkit]) accessSync(browser.executablePath(), constants.X_OK);
          NODE
      - id: baseline_build
        name: Build root-path test site
        run: pnpm run build
      - id: build_tests
        name: Verify built contracts and internal links
        run: |
          pnpm run test:build
          pnpm dlx linkinator@8.1.0 dist --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])'
      - id: default_browser
        run: pnpm run test:e2e -- --variant default --target desktop,narrow,webkit
      - id: i18n_browser
        run: pnpm run test:e2e -- --variant i18n --target desktop,narrow,webkit
      - id: forms_browser
        run: pnpm run test:e2e -- --variant configured-forms --target desktop,narrow,webkit
      - id: rendering_browser
        run: pnpm run test:e2e -- --variant rendering --target desktop,narrow,webkit
      - id: production_path_browser
        run: pnpm run test:e2e -- --variant production-path --target desktop
      - id: pages_build
        name: Build and check independent Pages output
        env:
          SITE_URL: https://sionrbot.github.io/blog/
        run: |
          pnpm run build
          pnpm exec vp test --project build tests/build/base-path.test.ts tests/build/routes.test.ts tests/build/seo.test.ts
          node scripts/check-production-output.ts dist "$SITE_URL"
          mkdir -p release-output
          cp -R dist release-output/pages
      - id: workers_build
        name: Build and check Workers prebuilt output
        env:
          SITE_URL: https://sionrbot-blog.pgsnotfound404.workers.dev/
        run: |
          pnpm run build
          pnpm exec vp test --project build tests/build/base-path.test.ts tests/build/routes.test.ts tests/build/seo.test.ts
          node scripts/check-production-output.ts dist "$SITE_URL"
          pnpm exec cf-wrangler build
          pnpm exec cf deploy --prebuilt --dry-run
      - id: workers_upload
        name: Preserve this run's Workers prebuilt output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workers-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - id: pages_upload
        name: Preserve this run's Pages output
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/pages
      - id: prepared
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: publish
        if: ${{ steps.candidate.outputs.kind == 'software' }}
        name: Publish or confirm the validated fixed version
        run: node scripts/release-fixed.ts publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - id: diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - id: preparation_summary
        if: ${{ always() }}
        name: Record validation, builds and software publication outcomes
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const steps = JSON.parse(process.env.STEP_RESULTS);
          const ids = ['admission', 'candidate', 'checks', 'browsers', 'baseline_build', 'build_tests', 'default_browser', 'i18n_browser', 'forms_browser', 'rendering_browser', 'production_path_browser', 'pages_build', 'workers_build', 'pages_upload', 'workers_upload', 'publish'];
          const kind = steps.candidate?.outputs?.kind;
          const rows = ids.map(id => `| ${id} | ${id === 'publish' && kind === 'content' ? 'not applicable (content)' : steps[id]?.outcome ?? 'not run'} |`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Preparation\n\n| Step | Outcome |\n| --- | --- |\n${rows.join('\n')}\n`);
          NODE

  # Independent jobs preserve each platform's failure and still attempt the other.
  # Only this job receives Pages write/OIDC permissions; validation does not.
  pages:
    needs: prepare
    outputs:
      gate: ${{ steps.pages_latest.outputs.deploy }}
      deploy: ${{ steps.pages_deploy.outcome }}
      smoke: ${{ steps.pages_smoke.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    steps:
      - id: pages_attempt
        name: Require validation and outputs from this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Re-run all jobs to validate and rebuild this fixed candidate before deployment.'
            exit 1
          fi
      - id: pages_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: pages_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - id: pages_latest
        name: Check software baseline and release HEAD before Pages deployment
        run: node scripts/release-fixed.ts latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: ${{ needs.prepare.outputs.tag-sha }}
      - id: pages_deploy
        if: ${{ steps.pages_latest.outputs.deploy == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: pages_smoke
        if: ${{ steps.pages_deploy.outcome == 'success' }}
        run: node scripts/smoke-site.ts https://sionrbot.github.io/blog/

  workers:
    needs: prepare
    outputs:
      gate: ${{ steps.workers_latest.outputs.deploy }}
      deploy: ${{ steps.workers_deploy.outcome }}
      smoke: ${{ steps.workers_smoke.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - id: workers_attempt
        name: Require validation and outputs from this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Re-run all jobs to validate and rebuild this fixed candidate before deployment.'
            exit 1
          fi
      - id: workers_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: workers_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - id: workers_pnpm
        run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - id: pnpm_store
        name: Locate pnpm store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm_cache
        name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml') }}
      - id: workers_dependencies
        run: pnpm install --frozen-lockfile
      - id: workers_download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.workers-artifact }}
          path: .cloudflare/output/
      - id: workers_latest
        name: Check software baseline and release HEAD before Workers deployment
        run: node scripts/release-fixed.ts latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: ${{ needs.prepare.outputs.tag-sha }}
      - id: workers_deploy
        if: ${{ steps.workers_latest.outputs.deploy == 'true' }}
        run: pnpm exec cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: workers_smoke
        if: ${{ steps.workers_deploy.outcome == 'success' }}
        run: node scripts/smoke-site.ts https://sionrbot-blog.pgsnotfound404.workers.dev/

  refresh:
    if: ${{ needs.prepare.outputs.kind == 'software' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-pr-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - id: pnpm_store
        name: Locate pnpm store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm_cache
        name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Refresh the next version PR after clearing pending
        run: node scripts/release.ts pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  summary:
    if: ${{ always() }}
    needs: [prepare, pages, workers, refresh]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: delivery_summary
        name: Record candidate and independent target results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.merge_commit_sha }}
          CANDIDATE_KIND: ${{ github.event_name == 'workflow_dispatch' && 'content' || 'software' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const candidate = jobs.prepare.outputs;
          const sha = /^[a-f0-9]{40}$/.test(process.env.CANDIDATE_SHA ?? '') ? process.env.CANDIDATE_SHA : 'invalid input';
          const rows = ['pages', 'workers'].map(target => {
            const job = jobs[target];
            const output = job.outputs;
            const gate = output.gate === 'false' ? 'superseded; deployment skipped' : output.gate === 'true' ? 'eligible' : 'not established';
            return `| ${target} | ${job.result} | ${gate} | ${output.deploy || 'not run'} | ${output.smoke || 'not run'} |`;
          });
          const publication = process.env.CANDIDATE_KIND === 'content' ? 'not applicable (content)' : candidate.publish || 'not run';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Fixed candidate', '',
            `- Kind: ${process.env.CANDIDATE_KIND}`,
            `- Source SHA: ${sha}`,
            `- Software version: ${candidate.version || 'not established'}`,
            `- Software tag: ${candidate.tag || 'not established'}`,
            `- Software tag SHA: ${candidate['tag-sha'] || 'not established'}`,
            `- Version PR: ${candidate.pr || 'not applicable / not established'}`,
            `- Run / attempt: ${process.env.GITHUB_RUN_ID} / ${process.env.GITHUB_RUN_ATTEMPT}`,
            `- Preparation: ${jobs.prepare.result}`,
            `- Software publication: ${publication}`,
            `- Version PR refresh: ${jobs.refresh.result}`, '',
            '| Target | Job | Eligibility | Deployment | Smoke |',
            '| --- | --- | --- | --- | --- |', ...rows, '',
            'Job success alone does not certify deployment: inspect eligibility, deployment and smoke separately.', '',
          ].join('\n'));
          NODE
