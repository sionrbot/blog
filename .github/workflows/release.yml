name: Release fixed source

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Covers validation, publication and both deployments. Maintenance has its own group.
concurrency:
  group: release-main
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release-please--branches--main--components--sionrbot-blog' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      attempt: ${{ steps.prepared.outputs.attempt }}
      workers-artifact: ${{ steps.workers_upload.outputs.artifact-id }}
    env:
      SITE_URL: https://sionrbot.github.io
      CF_SEND_TELEMETRY: 'false'
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - id: pnpm
        run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: candidate
        name: Fix version and source from the merged release PR
        run: node scripts/release-fixed.ts candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: checks
        name: Check source, translations, logic and timezones
        run: |
          pnpm run check
          pnpm exec vp check
          pnpm run lint
          pnpm run i18n:check
          pnpm run test:unit
          pnpm run test:unit:tz
      - id: browsers
        name: Verify preinstalled browser versions
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { accessSync, constants } from 'node:fs';
          const require = createRequire(import.meta.url);
          const webRequire = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = webRequire('playwright-core/package.json');
          if (version !== '1.64.1') throw new Error(`Update the container image for Playwright ${version}`);
          const { chromium, webkit } = webRequire('playwright-core');
          for (const browser of [chromium, webkit]) accessSync(browser.executablePath(), constants.X_OK);
          NODE
      - id: baseline_build
        name: Build root-path test site
        run: pnpm run build
      - id: build_tests
        name: Verify built contracts and internal links
        run: |
          pnpm run test:build
          pnpm dlx linkinator@8.1.0 dist --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])'
      - id: default_browser
        run: pnpm run test:e2e -- --variant default --target desktop,narrow,webkit
      - id: i18n_browser
        run: pnpm run test:e2e -- --variant i18n --target desktop,narrow,webkit
      - id: forms_browser
        run: pnpm run test:e2e -- --variant configured-forms --target desktop,narrow,webkit
      - id: rendering_browser
        run: pnpm run test:e2e -- --variant rendering --target desktop,narrow,webkit
      - id: production_path_browser
        run: pnpm run test:e2e -- --variant production-path --target desktop
      - id: pages_build
        name: Build and check independent Pages output
        env:
          SITE_URL: https://sionrbot.github.io/blog/
        run: |
          pnpm run build
          pnpm exec vp test --project build tests/build/base-path.test.ts tests/build/routes.test.ts tests/build/seo.test.ts
          node scripts/check-production-output.ts dist "$SITE_URL"
          mkdir -p release-output
          cp -R dist release-output/pages
      - id: workers_build
        name: Build and check Workers prebuilt output
        env:
          SITE_URL: https://sionrbot-blog.pgsnotfound404.workers.dev/
        run: |
          pnpm run build
          pnpm exec vp test --project build tests/build/base-path.test.ts tests/build/routes.test.ts tests/build/seo.test.ts
          node scripts/check-production-output.ts dist "$SITE_URL"
          pnpm exec cf-wrangler build
          pnpm exec cf deploy --prebuilt --dry-run
      - id: workers_upload
        name: Preserve this run's Workers prebuilt output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workers-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - id: pages_upload
        name: Preserve this run's Pages output
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/pages
      - id: prepared
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: publish
        name: Publish or confirm the validated fixed version
        run: node scripts/release-fixed.ts publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - id: diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Independent jobs preserve each platform's failure and still attempt the other.
  # Only this job receives Pages write/OIDC permissions; validation does not.
  pages:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    steps:
      - id: pages_attempt
        name: Require validation and outputs from this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Re-run all jobs to validate and rebuild this fixed candidate before deployment.'
            exit 1
          fi
      - id: pages_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: pages_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - id: pages_latest
        name: Check latest stable version before Pages deployment
        run: node scripts/release-fixed.ts latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: pages_deploy
        if: ${{ steps.pages_latest.outputs.deploy == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: pages_smoke
        if: ${{ steps.pages_deploy.outcome == 'success' }}
        run: node scripts/smoke-site.ts https://sionrbot.github.io/blog/

  workers:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - id: workers_attempt
        name: Require validation and outputs from this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Re-run all jobs to validate and rebuild this fixed candidate before deployment.'
            exit 1
          fi
      - id: workers_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: workers_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - id: workers_pnpm
        run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - id: workers_dependencies
        run: pnpm install --frozen-lockfile
      - id: workers_download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.workers-artifact }}
          path: .cloudflare/output/
      - id: workers_latest
        name: Check latest stable version before Workers deployment
        run: node scripts/release-fixed.ts latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: workers_deploy
        if: ${{ steps.workers_latest.outputs.deploy == 'true' }}
        run: pnpm exec cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: workers_smoke
        if: ${{ steps.workers_deploy.outcome == 'success' }}
        run: node scripts/smoke-site.ts https://sionrbot-blog.pgsnotfound404.workers.dev/

  refresh:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - name: Refresh the next version PR after clearing pending
        run: node scripts/release.ts pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
